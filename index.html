<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="EcoExplorers: Life on Land • Grade 2 Literature Day 2026. A swipe-through wildlife storybook for kids.">
  <title>EcoExplorers: Life on Land • Grade 2 Literature Day 2026</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  
  <!-- Google Fonts: Fredoka (Headings) & Nunito (Reading/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-haiti">

  <div class="storybook-wrapper" id="storybookApp">
    
    <!-- Screen Reader Live Announcer -->
    <div id="srLiveAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- ========================================================
         SCREEN 1: WELCOME SCREEN
         ======================================================== -->
    <section class="story-screen active" id="screenWelcome" aria-label="Welcome Screen">
      <!-- Top Utility Bar (Corner EN | ID toggle & Audio) -->
      <header class="screen-top-bar welcome-bar">
        <div class="brand-chip" aria-label="EcoExplorers">
          <span class="brand-chip-icon" aria-hidden="true">🌍</span>
          <span class="brand-chip-text">EcoExplorers</span>
        </div>
        <div class="top-bar-right">
          <div class="lang-segmented-toggle" role="group" aria-label="Language selection">
            <button type="button" class="lang-segment active" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" class="lang-segment" data-lang="id" aria-pressed="false">ID</button>
          </div>
        </div>
      </header>

      <!-- Mascot Hero Area (Fills top half) -->
      <div class="welcome-mascot-container">
        <svg class="welcome-mascot" viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Friendly Explorer Bear Mascot">
          <defs>
            <radialGradient id="mascotGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="bearFur" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
            <linearGradient id="hatGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fef3c7"/>
              <stop offset="100%" stop-color="#fde68a"/>
            </linearGradient>
            <linearGradient id="vestGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>

          <!-- Soft Glow Behind Mascot -->
          <circle cx="160" cy="140" r="130" fill="url(#mascotGlow)"/>

          <!-- Bear Ears -->
          <circle cx="100" cy="95" r="28" fill="url(#bearFur)"/>
          <circle cx="100" cy="95" r="16" fill="#fbcfe8"/>
          <circle cx="220" cy="95" r="28" fill="url(#bearFur)"/>
          <circle cx="220" cy="95" r="16" fill="#fbcfe8"/>

          <!-- Bear Head -->
          <circle cx="160" cy="145" r="68" fill="url(#bearFur)"/>

          <!-- Muzzle Area -->
          <ellipse cx="160" cy="165" rx="34" ry="26" fill="#fef3c7"/>
          <!-- Nose -->
          <ellipse cx="160" cy="154" rx="12" ry="8" fill="#78350f"/>
          <!-- Cheerful Smile -->
          <path d="M150 167 C155 175, 165 175, 170 167" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          <path d="M160 158 L160 169" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

          <!-- Rosy Cheeks -->
          <circle cx="118" cy="162" r="11" fill="#f472b6" fill-opacity="0.6"/>
          <circle cx="202" cy="162" r="11" fill="#f472b6" fill-opacity="0.6"/>

          <!-- Bright Expressive Eyes -->
          <ellipse cx="132" cy="136" rx="9" ry="12" fill="#1e293b"/>
          <circle cx="135" cy="132" r="4.5" fill="#ffffff"/>
          <circle cx="130" cy="141" r="2" fill="#ffffff"/>

          <ellipse cx="188" cy="136" rx="9" ry="12" fill="#1e293b"/>
          <circle cx="191" cy="132" r="4.5" fill="#ffffff"/>
          <circle cx="186" cy="141" r="2" fill="#ffffff"/>

          <!-- Explorer Hat (Safari Pith Helmet) -->
          <!-- Hat Crown -->
          <path d="M105 105 C105 52, 215 52, 215 105 Z" fill="url(#hatGradient)"/>
          <!-- Hat Ribbon -->
          <path d="M105 102 C135 96, 185 96, 215 102 L215 107 C185 101, 135 101, 105 107 Z" fill="#047857"/>
          <!-- Hat Leaf Badge -->
          <circle cx="160" cy="98" r="9" fill="#10b981"/>
          <path d="M160 93 C164 97, 163 103, 160 104 C157 103, 156 97, 160 93 Z" fill="#ffffff"/>
          <!-- Hat Brim -->
          <ellipse cx="160" cy="106" rx="72" ry="14" fill="#fbbf24"/>

          <!-- Bear Body & Explorer Vest -->
          <path d="M110 205 C110 190, 210 190, 210 205 L225 270 C225 285, 95 285, 95 270 Z" fill="url(#bearFur)"/>
          <path d="M115 208 C130 200, 190 200, 205 208 L220 270 C190 262, 130 262, 100 270 Z" fill="url(#vestGradient)"/>
          <path d="M160 202 L160 266" stroke="#065f46" stroke-width="3" stroke-dasharray="4 3"/>

          <!-- Compass Badge on Vest -->
          <circle cx="136" cy="235" r="9" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
          <polygon points="136 229, 139 235, 136 241, 133 235" fill="#ef4444"/>

          <!-- Welcoming Waving Paw (Right) -->
          <g class="mascot-waving-paw">
            <ellipse cx="236" cy="180" rx="18" ry="15" fill="url(#bearFur)" transform="rotate(-20 236 180)"/>
            <circle cx="236" cy="180" r="8" fill="#fef3c7"/>
            <circle cx="228" cy="170" r="4" fill="#fef3c7"/>
            <circle cx="236" cy="167" r="4" fill="#fef3c7"/>
            <circle cx="245" cy="171" r="4" fill="#fef3c7"/>
          </g>

          <!-- Left Paw Resting on Vest -->
          <ellipse cx="85" cy="225" rx="16" ry="14" fill="url(#bearFur)"/>
          <circle cx="85" cy="225" r="7" fill="#fef3c7"/>

          <!-- Floating Nature Sparkles -->
          <g class="mascot-sparkles">
            <path d="M60 90 L63 97 L70 100 L63 103 L60 110 L57 103 L50 100 L57 97 Z" fill="#f59e0b"/>
            <path d="M265 80 L267 85 L272 87 L267 89 L265 94 L263 89 L258 87 L263 85 Z" fill="#10b981"/>
            <circle cx="75" cy="150" r="4" fill="#38bdf8"/>
            <circle cx="250" cy="140" r="4" fill="#f43f5e"/>
          </g>
        </svg>
      </div>

      <!-- Welcome Text & Audio Area -->
      <div class="welcome-content">
        <div class="welcome-heading-row">
          <h1 class="welcome-title" id="welcomeTitle">EcoExplorers!</h1>
          <button type="button" class="btn-speaker" id="btnWelcomeAudio" aria-label="Listen to welcome message" title="Listen">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
        </div>
        <p class="welcome-subtitle" id="welcomeSub">Explore Amazing Wildlife!</p>
      </div>

      <!-- Big Bottom Start Action -->
      <div class="welcome-action-area">
        <button type="button" class="btn-start" id="btnStartAdventure" aria-label="Start Adventure">
          <span class="btn-start-text" id="startBtnLabel">Start Adventure 🚀</span>
        </button>
      </div>
    </section>

    <!-- ========================================================
         SCREEN 2: PICK YOUR COUNTRY
         ======================================================== -->
    <section class="story-screen" id="screenPickCountry" aria-label="Pick Your Country Screen">
      <!-- Screen Header -->
      <header class="screen-top-bar">
        <button type="button" class="btn-icon-nav" id="btnBackToWelcome" aria-label="Back to Welcome">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="screen-title-group">
          <h1 class="screen-heading" id="pickCountryHeading">Pick Your Country</h1>
          <button type="button" class="btn-speaker-sm" id="btnPickCountryAudio" aria-label="Listen to instructions" title="Listen">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
        </div>
        <div class="lang-segmented-toggle" role="group" aria-label="Language selection">
          <button type="button" class="lang-segment active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-segment" data-lang="id" aria-pressed="false">ID</button>
        </div>
      </header>

      <!-- Three Giant Country Cards Stacked Vertically (~1/3 height each) -->
      <div class="country-cards-stack" id="countryCardsContainer">
        <!-- Rendered dynamically by script.js with large photos & per-country colors -->
      </div>
    </section>

    <!-- ========================================================
         SCREEN 3: THE TRAIL
         ======================================================== -->
    <section class="story-screen" id="screenTrail" aria-label="The Wildlife Trail Screen">
      <!-- Trail Top Bar -->
      <header class="screen-top-bar trail-bar">
        <button type="button" class="country-switch-pill" id="btnTrailCountryPill" aria-label="Active country. Tap to change country.">
          <span class="pill-flag" id="trailFlag">🇭🇹</span>
          <span class="pill-name" id="trailCountryName">Haiti</span>
          <span class="pill-arrow" aria-hidden="true">▾</span>
        </button>
        <div class="screen-title-group">
          <h1 class="screen-heading-sm" id="trailHeading">Wildlife Trail</h1>
          <button type="button" class="btn-speaker-sm" id="btnTrailAudio" aria-label="Listen to trail instructions" title="Listen">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
        </div>
        <div class="lang-segmented-toggle" role="group" aria-label="Language selection">
          <button type="button" class="lang-segment active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-segment" data-lang="id" aria-pressed="false">ID</button>
        </div>
      </header>

      <!-- Star Progress Indicator Bar -->
      <div class="trail-progress-container">
        <div class="trail-stars-row" id="trailStarsRow" aria-label="Star progress">
          <!-- 6 Stars rendered dynamically -->
        </div>
        <p class="trail-progress-label" id="trailProgressLabel">0 of 6 Stars</p>
      </div>

      <!-- Winding Trail Viewport -->
      <div class="trail-viewport" id="trailViewport">
        <!-- Connecting SVG Path -->
        <svg class="trail-path-svg" id="trailPathSvg" viewBox="0 0 340 540" fill="none" aria-hidden="true">
          <path id="trailCurvedLine" d="M 75,55 C 265,95 265,160 265,190 C 265,225 75,255 75,285 C 75,320 265,350 265,380 C 265,415 165,445 165,475" stroke="var(--country-theme)" stroke-width="10" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.35"/>
        </svg>

        <!-- 6 Creature Bubbles positioned along the winding trail -->
        <div class="trail-bubbles-grid" id="trailBubblesGrid">
          <!-- Rendered dynamically by script.js -->
        </div>
      </div>
    </section>

    <!-- ========================================================
         BOTTOM BAR (4 Items: Home, Trail, Quiz, My Badges)
         ======================================================== -->
    <nav class="story-bottom-bar" id="storyBottomNav" aria-label="Storybook navigation">
      <button type="button" class="bottom-nav-item" id="navItemHome" data-screen="welcome" aria-label="Home screen">
        <span class="nav-icon" aria-hidden="true">🏡</span>
        <span class="nav-label" id="bottomNavHomeLabel">Home</span>
      </button>
      <button type="button" class="bottom-nav-item active" id="navItemTrail" data-screen="trail" aria-label="Wildlife Trail">
        <span class="nav-icon" aria-hidden="true">🗺️</span>
        <span class="nav-label" id="bottomNavTrailLabel">Trail</span>
      </button>
      <button type="button" class="bottom-nav-item" id="navItemQuiz" data-screen="quiz" aria-label="Quiz">
        <span class="nav-icon" aria-hidden="true">⭐</span>
        <span class="nav-label" id="bottomNavQuizLabel">Quiz</span>
      </button>
      <button type="button" class="bottom-nav-item" id="navItemBadges" data-screen="badges" aria-label="My Badges">
        <span class="nav-icon" aria-hidden="true">🛡️</span>
        <span class="nav-label" id="bottomNavBadgesLabel">My Badges</span>
      </button>
    </nav>

    <!-- ========================================================
         CREATURE PREVIEW MODAL / BOTTOM SHEET
         (Feedback when tapping a trail bubble)
         ======================================================== -->
    <div class="story-sheet-backdrop" id="creatureSheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sheetCreatureName">
      <div class="story-sheet">
        <button type="button" class="sheet-close-btn" id="btnSheetClose" aria-label="Close dialog">✕</button>
        <div class="sheet-photo-container">
          <img id="sheetCreatureImg" src="" alt="" width="320" height="220" class="sheet-creature-photo">
          <span class="sheet-stamp-pop" id="sheetStampBadge" aria-hidden="true">⭐</span>
        </div>
        <div class="sheet-body">
          <div class="sheet-title-row">
            <h2 class="sheet-creature-name" id="sheetCreatureName">Creature Name</h2>
            <button type="button" class="btn-speaker" id="btnSheetAudio" aria-label="Listen to creature description" title="Listen">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>
          </div>
          <span class="sheet-type-pill" id="sheetTypePill">🐾 Animal</span>
          <p class="sheet-quick-read" id="sheetQuickRead">Quick read sentence goes here.</p>
          <div class="sheet-feedback" id="sheetFeedback">
            <span class="stamp-pill" id="sheetStampPill">⭐ Star Stamp Collected!</span>
          </div>
          <button type="button" class="btn-sheet-action" id="btnSheetContinue">Keep Exploring 🌟</button>
        </div>
      </div>
    </div>

    <!-- ========================================================
         INFO / TEASER MODAL FOR QUIZ & BADGES
         ======================================================== -->
    <div class="story-sheet-backdrop" id="teaserSheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="teaserTitle">
      <div class="story-sheet teaser-sheet">
        <button type="button" class="sheet-close-btn" id="btnTeaserClose" aria-label="Close dialog">✕</button>
        <div class="teaser-icon" id="teaserIcon">🌟</div>
        <h2 class="teaser-title" id="teaserTitle">Almost There!</h2>
        <p class="teaser-desc" id="teaserDesc">Explore all 6 creatures on the trail to unlock this screen!</p>
        <button type="button" class="btn-sheet-action" id="btnTeaserAction">Back to Trail 🗺️</button>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
